# cargo-deny: fail CI on licenses that would force Photon's source to be published.
[graph]
all-features = false

[licenses]
# Anything not listed here (GPL, AGPL, LGPL, unknown) fails the build.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Licenses we pre-approve for later dependencies (jpegli is BSD-3-Clause).
unused-allowed-license = "allow"
# Our own crate is not published, so it needs no license entry.
private = { ignore = true }

[bans]
multiple-versions = "allow"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
