# cargo-deny: Photon is GPL-3.0-or-later, so every dependency must be GPLv3-compatible.
[graph]
all-features = false

[licenses]
# Anything not listed here fails the build: GPLv3-incompatible licenses (GPL-2.0-only,
# LGPL-2.1-only, EPL, CDDL...), AGPL (stricter than Photon's own terms) and unknown ones.
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Licenses we pre-approve for later dependencies (jpegli is BSD-3-Clause).
unused-allowed-license = "allow"
# Check Photon's own crates too, so each one keeps its license entry.
private = { ignore = false }

[bans]
multiple-versions = "allow"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
