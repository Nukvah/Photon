name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - name: Fetch jpegli sources
        working-directory: .
        run: scripts/fetch-jpegli.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Includes the golden output test (tests/golden.rs) against tests/golden/x86_64.tsv.
      - run: cargo test --workspace --release
      - name: Encoder benchmark (host, synthetic image)
        run: cargo run --release --example bench
      - name: CLI smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/in"
          cp jpegli-sys/jpegli/third_party/libjpeg-turbo/testimages/testorig.jpg "$RUNNER_TEMP/in/"
          cargo run --release -p photon-cli -- --preset standard "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"
          test -s "$RUNNER_TEMP/out/testorig.jpg"

  licenses:
    name: License check (no GPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check licenses bans sources

  android:
    name: Android app (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v5
      - name: Fetch jpegli sources
        run: scripts/fetch-jpegli.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The Ubuntu runner ships the Android SDK; only the pinned NDK needs installing.
      - name: Install NDK
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        # recordRoborazziDebug runs all unit tests and renders the screenshot tests to PNG.
        run: ./gradlew --stacktrace assembleDebug recordRoborazziDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: photon-screenshots
          path: app/src/test/screenshots/
      - name: Check 16 KB page alignment
        run: |
          export READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          scripts/check-16kb.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Check permissions (privacy policy)
        run: scripts/check-permissions.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Native library sizes
        run: unzip -lv app/build/outputs/apk/debug/app-debug.apk 'lib/*' | awk 'NR<=3 || /lib\//'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: photon-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
